<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Portfolio Admin</title>
    <link rel="stylesheet" type="text/css" href="/loader.css" />
  </head>
  <body>
    <div id="app">
      <div id="loading-bg">
        <div class="loading-logo">
          <img src="/favicon.svg" alt="" width="56" height="56" />
        </div>
        <div class="loading">
          <div class="effect-1 effects"></div>
          <div class="effect-2 effects"></div>
          <div class="effect-3 effects"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Keys are written by src/core/initConfig.ts via namespaceConfig() ("<app title>-<key>")
      const loaderColor = localStorage.getItem("prajwal sainju-initial-loader-bg") || "#FFFFFF";
      const primaryColor = localStorage.getItem("prajwal sainju-initial-loader-color") || "#9A7023";

      document.documentElement.style.setProperty("--initial-loader-bg", loaderColor);
      document.documentElement.style.setProperty("--initial-loader-color", primaryColor);
    </script>
  </body>
</html>
